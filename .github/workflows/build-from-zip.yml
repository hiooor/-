name: Build TranslateVision from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'TranslateVision-Android-APK-Build-Package-1.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Extract source
        run: |
          unzip -q TranslateVision-Android-APK-Build-Package-1.zip -d unpacked

      - name: Build APK
        working-directory: unpacked/TranslateVision
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TranslateVision-debug-apk
          path: unpacked/TranslateVision/app/build/outputs/apk/debug/app-debug.apk
